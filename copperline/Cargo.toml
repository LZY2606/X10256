[package]
name = "copperline"
version = "0.1.0"
edition = "2021"
description = "Offline PCB/Gerber/geometry connectivity review workbench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.test]
opt-level = 1
