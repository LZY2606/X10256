[package]
name = "pcb-geom-review"
version = "0.1.0"
edition = "2021"
description = "Copper connectivity review bench: Gerber/drill/stackup import, geometry connectivity candidates, event-sourced review"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

