[package]
name = "pcb-connectivity"
version = "0.1.0"
edition = "2021"
description = "Offline Gerber/Excellon/stackup import, copper reconstruction and connectivity-candidate workbench"

[lib]
name = "pcbc"
path = "src/lib.rs"

[[bin]]
name = "pcb-connectivity"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "unwind"
