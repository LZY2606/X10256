[package]
name = "pairwise-gsb"
version = "0.1.0"
edition = "2021"
description = "Offline PCB/Gerber/geometric connectivity review workbench"

[[bin]]
name = "pairwise-gsb"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
