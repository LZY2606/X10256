[package]
name = "pcb-review"
version = "0.1.0"
edition = "2021"
description = "Offline Gerber/Excellon/stackup review and copper connectivity candidate workbench"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dev]
opt-level = 1

[[bin]]
name = "pcb-review"
path = "src/main.rs"
