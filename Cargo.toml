[package]
name = "pcb-geom-review"
version = "0.1.0"
edition = "2021"
description = "PCB Gerber/Excellon geometric connectivity review workbench (offline)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
thiserror = "1"
mime_guess = "2"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3"
