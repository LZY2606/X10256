[package]
name = "pcb-gsb"
version = "0.1.0"
edition = "2021"
description = "Offline PCB / Gerber / Excellon geometric connectivity review workbench"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5.2", features = ["fs", "set-header"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
opt-level = 0
