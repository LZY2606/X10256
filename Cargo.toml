[package]
name = "pcb-connect-audit"
version = "0.1.0"
edition = "2021"
description = "Offline Gerber/Excellon copper connectivity audit bench with immutable evidence log"

[lib]
name = "pcb_connect_audit"
path = "src/lib.rs"

[[bin]]
name = "pcb-connect-audit"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
panic = "abort"
