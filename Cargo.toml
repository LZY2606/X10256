[package]
name = "pcb-conn"
version = "0.1.0"
edition = "2021"
description = "PCB/Gerber geometric connectivity review workbench (offline)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
