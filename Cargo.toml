[package]
name = "gsb-pcb"
version = "0.1.0"
edition = "2021"
description = "Offline PCB Gerber/Excellon/stackup import, geometry reconstruction and connectivity-candidate workbench"

[lib]
name = "gsbpcb"
path = "src/lib.rs"

[[bin]]
name = "gsb-pcb"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
