[package]
name = "pcb-connect"
version = "0.1.0"
edition = "2021"
description = "Offline PCB Gerber/Excellon geometric connectivity review workbench"

[lib]
name = "pcb_connect"
path = "src/lib.rs"

[[bin]]
name = "pcb-connect"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[profile.dev]
opt-level = 1
