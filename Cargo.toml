[package]
name = "pcb-connectivity-bench"
version = "1.0.0"
edition = "2021"

[lib]
name = "pcbbench"
path = "src/lib.rs"

[[bin]]
name = "pcb-connectivity-bench"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
