[package]
name = "pcb-connectivity"
version = "0.1.0"
edition = "2021"
description = "Offline Gerber/Excellon/stackup import, copper reconstruction and connectivity-candidate review workbench"

[lib]
name = "pcb_conn"
path = "src/lib.rs"

[[bin]]
name = "pcb-connectivity"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "unwind"
