[package]
name = "cuconnect"
version = "0.1.0"
edition = "2021"
description = "铜层连通谱: Gerber 图层、孔表与网络候选核验台"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
