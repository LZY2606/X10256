[package]
name = "gsb-pcb"
version = "0.1.0"
edition = "2021"
description = "Offline Gerber/Excellon/stackup import, copper/drill/solder-mask reconstruction and connectivity candidate review"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
clap = { version = "4", features = ["derive"] }

[profile.dev]
opt-level = 1

[lib]
name = "gsb"
path = "src/lib.rs"

[[bin]]
name = "gsb-server"
path = "src/main.rs"
