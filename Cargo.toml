[package]
name = "pcb-gsb"
version = "0.1.0"
edition = "2021"
description = "Offline Gerber/Excellon/stackup import, copper reconstruction and connectivity-candidate review"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
all = "warn"

[profile.dev]
opt-level = 0
