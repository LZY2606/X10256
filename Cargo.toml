[package]
name = "pcb_gerber_conn"
version = "0.1.0"
edition = "2021"
description = "Offline PCB Gerber/Excellon/stackup import, copper reconstruction and electrical connectivity candidate review"

[lib]
name = "pcb_gerber_conn"
path = "src/lib.rs"

[[bin]]
name = "pcb-gerber-conn"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
