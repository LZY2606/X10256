[package]
name = "pcb-gsb"
version = "0.1.0"
edition = "2021"

[lib]
name = "pcb_gsb"
path = "src/lib.rs"

[[bin]]
name = "pcb-gsb"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.dev]
opt-level = 1
