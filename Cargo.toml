[package]
name = "pcb-review"
version = "0.1.0"
edition = "2021"
description = "Offline Gerber/Excellon/stackup import, copper reconstruction and electrical connectivity candidate review"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
