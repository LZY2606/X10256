[package]
name = "pcb-gsb"
version = "0.1.0"
edition = "2021"
description = "Offline PCB Gerber / Excellon / stackup import, geometry and connectivity-candidate review workbench"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
