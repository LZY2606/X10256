[package]
name = "pcb-gsb"
version = "0.1.0"
edition = "2021"
description = "Offline PCB/Gerber geometry connectivity review bench"

[dependencies]
axum = "0.7.9"
rusqlite = { version = "0.35.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time"] }
tower = "0.5"
tower-http = { version = "0.5.2", features = ["fs", "set-header"] }
uuid = { version = "1.26", features = ["v4"] }
sha2 = "0.10"

[[bin]]
name = "pcb-gsb"
path = "src/main.rs"

[profile.dev]
opt-level = 0
