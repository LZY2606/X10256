[package]
name = "pcb-connect"
version = "0.1.0"
edition = "2021"

[lib]
name = "pcb_connect"
path = "src/lib.rs"

[[bin]]
name = "pcb-connect"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "set-header"] }

[profile.dev]
opt-level = 0
